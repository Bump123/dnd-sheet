<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D&D Party – Oversigt</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#1a1a2e;color:#e0ddd5;font-family:'Crimson Text',serif;min-height:100vh;padding:3rem 1.5rem}
    header{text-align:center;margin-bottom:3rem}
    h1{font-family:'Cinzel',serif;font-size:2.2rem;font-weight:700;color:#cecbf6;letter-spacing:.12em;margin-bottom:.5rem}
    header p{font-family:'Cinzel',serif;font-size:.78rem;color:#afa9ec;letter-spacing:.1em}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1.25rem;max-width:900px;margin:0 auto}
    a.btn{
      display:flex;align-items:center;justify-content:center;
      padding:1.6rem 1rem;border-radius:10px;text-decoration:none;border:1px solid;
      font-family:'Cinzel',serif;font-size:1.1rem;font-weight:600;letter-spacing:.06em;
      transition:transform .15s,box-shadow .15s;text-align:center;
    }
    a.btn:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.45)}
    a.btn.spiller{background:#085041;border-color:#5dcaa5;color:#9fe1cb}
    a.btn.dm{background:#712b13;border-color:#f0997b;color:#f5c4b3}
  </style>
</head>
<body>
  <header>
    <h1>⚔ D&amp;D Party ⚔</h1>
    <p>Vælg en spiller</p>
  </header>
  <div class="grid">
    <a class="btn spiller" href="spiller1/">Spiller 1</a>
    <a class="btn spiller" href="spiller2/">Spiller 2</a>
    <a class="btn spiller" href="spiller3/">Spiller 3</a>
    <a class="btn spiller" href="spiller4/">Spiller 4</a>
    <a class="btn spiller" href="spiller5/">Spiller 5</a>
    <a class="btn dm"      href="dm/">DM</a>
  </div>
</body>
</html>
