<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spiller 2 – Karakter 1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a2e; color: #e0ddd5; font-family: system-ui, sans-serif; padding: 2rem; }
    .back { color: #9fe1cb; text-decoration: none; font-size: 0.9rem; display: inline-block; margin-bottom: 1.5rem; }
    .back:hover { text-decoration: underline; }
    h1 { color: #9fe1cb; font-size: 2rem; margin-bottom: 0.25rem; }
    .meta { color: #5dcaa5; font-size: 0.95rem; margin-bottom: 2rem; }
    .sheet { background: #0d2e27; border: 1px solid #5dcaa5; border-radius: 10px; padding: 1.5rem; max-width: 700px; }
    .sheet h2 { color: #9fe1cb; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem; border-bottom: 1px solid #085041; padding-bottom: 0.5rem; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    .stat { background: #085041; border-radius: 8px; padding: 0.75rem; text-align: center; }
    .stat .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: #5dcaa5; }
    .stat .value { font-size: 1.5rem; font-weight: 700; color: #9fe1cb; }
    .placeholder { color: #5a6e67; font-style: italic; font-size: 0.9rem; }
  </style>
</head>
<body>
  <a class="back" href="../../">← Tilbage til oversigt</a>
  <h1>Karakter 1</h1>
  <p class="meta">Spiller 2 &nbsp;·&nbsp; Race &nbsp;·&nbsp; Klasse &nbsp;·&nbsp; Niveau 1</p>
  <div class="sheet">
    <h2>Evnescorer</h2>
    <div class="stats">
      <div class="stat"><div class="label">Styrke</div><div class="value">10</div></div>
      <div class="stat"><div class="label">Smidighed</div><div class="value">10</div></div>
      <div class="stat"><div class="label">Fysik</div><div class="value">10</div></div>
      <div class="stat"><div class="label">Intelligens</div><div class="value">10</div></div>
      <div class="stat"><div class="label">Visdom</div><div class="value">10</div></div>
      <div class="stat"><div class="label">Karisma</div><div class="value">10</div></div>
    </div>
    <h2>Baggrund</h2>
    <p class="placeholder">Karakterens baggrund udfyldes her…</p>
  </div>
</body>
</html>
